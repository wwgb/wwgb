name: Update Cat Game Daily

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install canvas
      - name: Run game updater
        run: node update-game.js
      - name: Generate three-card image
        run: node generate-image.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md three-cards.png
          git diff --quiet && git diff --staged --quiet || git commit -m "🎮 更新每日游戏和卡片图片"
          git push
